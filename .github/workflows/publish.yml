# Publishes the package to npm on every "v*" tag (e.g. npm version patch && git push --follow-tags).
# Authenticates through trusted publishing (OIDC): no npm token stored in GitHub,
# provenance signed automatically. The trusted publisher must be declared on npmjs.com.
name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm ≥ 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      - run: npm ci # also runs "prepare" (build)
      - run: npm run typecheck
      - run: npm test
      - name: npm does not auto-correct package.json (it would silently drop e.g. the bin)
        run: |
          if npm publish --dry-run --ignore-scripts 2>&1 | tee /dev/stderr | grep -q "auto-corrected"; then
            echo "::error::npm auto-corrects package.json on publish: run \"npm pkg fix\" and review the diff."
            exit 1
          fi
      - run: npm publish
